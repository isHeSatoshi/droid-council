      <div class="lbl" id="s4-l2" style="left: 620px; top: 12px">13 workers</div>
      <div class="lbl" id="s4-l3" style="left: 1020px; top: 12px">judge · reduce</div>
      <div id="s4-tick">0 s</div>
    </div>

    <div id="s4-cap">166 s of a 391 s run went by before a single line of code was written.</div>
  </div>

  <script>
    // real team-fast timings, on one 0-420 s axis
    const AX = 420;
    const W = 1400;
    const PXS = W / AX;
    const PLAN_END = 165.9;
    const WORK_END = 296.1;
    const RED_END = 386.8;
    const WALL = 391;

    const plan = document.getElementById("s4-plan");
    const work = document.getElementById("s4-work");
    const red = document.getElementById("s4-red");
    const wm = document.getElementById("s4-wm");
    const tick = document.getElementById("s4-tick");

    const tl = gsap.timeline({ paused: true });

    // glitch cut in: a short horizontal smear that snaps sharp
    tl.fromTo("#root", { x: -46, filter: "blur(16px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.22, ease: "power4.out" }, 0);

    tl.to("#s4-title", { opacity: 1, duration: 0.3 }, 0.2);
    tl.to("#s4-orch", { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.35);
    tl.to("#s4-wire", { opacity: 1, duration: 0.2 }, 0.6);
    tl.to("#s4-pool", { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.7);
    tl.fromTo("#s4-cross", { opacity: 0, scale: 2.1 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 1.25);
    tl.to("#s4-note", { opacity: 1, duration: 0.3 }, 1.75);

    // the run strip, revealed as a live clock
    tl.to("#s4-axis", { scaleX: 1, duration: 0.01 }, 0);
    tl.fromTo("#s4-strip", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);

    const clock = { t: 0 };
    tl.to(
      clock,
      {
        t: 1,
        duration: 3.4,
        ease: "none",
        onUpdate: () => {
          const s = clock.t * PLAN_END;
          plan.style.width = s * PXS + "px";
          plan.style.opacity = 1;
          tick.textContent = Math.round(s) + " s";
          tick.style.left = s * PXS + "px";
        },
      },
      2.8,
    );
    tl.set("#s4-tick", { color: "#fff", fontSize: 19 }, 6.2);
    tl.to("#s4-l1", { opacity: 1, duration: 0.25 }, 3.2);

    // the block lands all at once, because the real starts are 100 ms apart.
    // geometry is written straight to the element; only the reveal is tweened.
    work.style.left = PLAN_END * PXS + "px";
    work.style.width = (WORK_END - PLAN_END) * PXS + "px";
    red.style.left = WORK_END * PXS + "px";
    red.style.width = (RED_END - WORK_END) * PXS + "px";

    tl.fromTo(
      "#s4-work",
      { opacity: 0, clipPath: "inset(0 100% 0 0)" },
      { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.16, ease: "power2.out" },
      6.25,
    );
    tl.to("#s4-l2", { opacity: 1, duration: 0.25 }, 6.4);
    tl.fromTo(
      "#s4-red",
      { opacity: 0, clipPath: "inset(0 100% 0 0)" },
      { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.16 },
      6.6,
    );
    tl.to("#s4-l3", { opacity: 1, duration: 0.25 }, 6.75);
    wm.style.left = WALL * PXS + "px";
    tl.to("#s4-wm", { opacity: 1, duration: 0.02 }, 6.9);

    tl.to("#s4-cap", { opacity: 1, duration: 0.35 }, 7.0);
    // the caption clears out before the push-in, so it never slides into the presenter strip
    tl.to("#s4-cap", { opacity: 0, duration: 0.18, ease: "power2.in" }, 8.92);

    // hand off to the next shot: the strip's work block grows past the frame
    tl.to("#root", { scale: 1.42, x: -180, y: 40, transformOrigin: "30% 62%", duration: 0.75, ease: "power2.in" }, 9.11);

    window.__timelines = window.__timelines || {};
    window.__timelines["s4"] = tl;
  </script>
