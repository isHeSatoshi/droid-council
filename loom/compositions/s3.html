  <script>
    // a 90s-style dither wipe: a grid of desktop-coloured tiles that leave in a diagonal wave
    const d = document.getElementById("s3-dither");
    const tiles = [];
    for (let y = 0; y < 1080; y += 96) {
      for (let x = 0; x < 1920; x += 96) {
        const t = document.createElement("i");
        t.style.left = x + "px";
        t.style.top = y + "px";
        d.appendChild(t);
        tiles.push({ el: t, order: (x / 96 + y / 96) * 0.016 });
      }
    }

    const tl = gsap.timeline({ paused: true });

    tiles.forEach((t) => {
      tl.to(t.el, { opacity: 0, duration: 0.01 }, 0.02 + t.order);
    });
    tl.to("#s3-dither", { opacity: 0, duration: 0.01 }, 0.9);

    tl.to("#s3-title", { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.42);
    tl.to("#s3-runA", { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.6);
    tl.to("#s3-runB", { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.78);

    tl.to("#s3-pipe .h", { opacity: 1, duration: 0.3 }, 1.9);
    tl.to("#s3-st1", { opacity: 1, scale: 1, duration: 0.34, ease: "power4.out" }, 2.05);
    tl.to("#s3-ar1", { opacity: 1, duration: 0.2 }, 2.3);
    tl.to("#s3-st2", { opacity: 1, scale: 1, duration: 0.34, ease: "power4.out" }, 2.45);
    tl.to("#s3-ar2", { opacity: 1, duration: 0.2 }, 2.7);
    tl.to("#s3-st3", { opacity: 1, scale: 1, duration: 0.34, ease: "power4.out" }, 2.85);
    tl.to("#s3-total", { opacity: 1, duration: 0.3 }, 3.5);
    tl.to("#s3-code", { opacity: 1, duration: 0.4, ease: "power3.out" }, 4.6);

    window.__timelines = window.__timelines || {};
    window.__timelines["s3"] = tl;
  </script>
