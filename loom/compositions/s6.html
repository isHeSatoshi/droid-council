  <script>
    // real wall clocks from analysis.py
    const RUNS = [
      { id: "s6-a", wall: 261, top: 150 },
      { id: "s6-b", wall: 631, top: 310 },
      { id: "s6-c", wall: 391, top: 470 },
    ];
    const PXR = 900 / 631;
    const rows = RUNS.map((r) => ({
      ...r,
      el: document.getElementById(r.id),
      fl: document.querySelector("#" + r.id + " .fl"),
    }));

    const tl = gsap.timeline({ paused: true });

    // whip in from the left, the previous shot's push continuing
    tl.fromTo("#root", { x: 90, filter: "blur(14px)", opacity: 0 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.26, ease: "power3.out" }, 0);

    tl.to("#s6-title", { opacity: 1, duration: 0.28 }, 0.18);
    tl.to("#s6-sub", { opacity: 1, duration: 0.28 }, 0.4);

    rows.forEach((r, i) => {
      const t = 0.7 + i * 0.5;
      tl.to(r.el, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t);
      tl.set(r.fl, { width: r.wall * PXR }, t + 0.1);
      tl.fromTo(r.fl, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, t + 0.1);
      const v = r.el.querySelector(".wv");
      tl.set(v, { left: 320 + r.wall * PXR + 16 }, t + 0.1);
      tl.to(v, { opacity: 1, duration: 0.2 }, t + 0.5);
      tl.to(r.el.querySelector(".th"), { opacity: 1, duration: 0.25 }, t + 0.7);
    });

    rows.forEach((r) => (r.el.querySelector(".wv").textContent = r.wall + " s"));

    tl.fromTo("#s6-win1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.28, ease: "power4.out" }, 3.35);
    tl.fromTo("#s6-win2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.28, ease: "power4.out" }, 5.9);
    tl.fromTo("#s6-credit", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 7.8);

    window.__timelines = window.__timelines || {};
    window.__timelines["s6"] = tl;
